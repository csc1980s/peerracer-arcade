name: Game tests

# Free GitHub Actions run: rule tests for every game, then a headless-browser smoke test.
on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --ignore-scripts
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    needs: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --ignore-scripts
      - run: npm install --no-save --ignore-scripts playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke_browser.mjs
